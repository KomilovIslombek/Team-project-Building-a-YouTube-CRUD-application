<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="./css/register.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/material-design-iconic-font.css">
    <link rel="stylesheet" href="./css/material-design-iconic-font.min.css">
</head>
<body> 
    <div class="container">
        <div class="wrapper">
            <h1 class="title">Registration Page</h1>
            <form id="registerForm" action="#" class="site-form">
                <span id="errorMessage" style="margin-bottom: 15px; height: 19px; color: red;">bu fake error xabar</span>
                <label>
                    <span class="zmdi zmdi-account"></span>
                    <input type="text" id="usernameInput" name="username" value="test1" placeholder="Your name" required>
                </label>
                <label>
                    <span class="zmdi zmdi-lock"></span>
                    <input type="password" id="passwordInput" name="password" value="12345678" placeholder="Password" required>
                    <button class="zmdi zmdi-eye" type="button" id="showButton"></button>
                </label>
                <label class="custom-upload">
                    <span class="zmdi zmdi-upload"></span>
                    <span class="file-name">click upload a avatar picture</span>
                    <input type="file" id="uploadInput" name="avatar" accept="image/*">
                </label>
                <input type="submit" value="Register" id="submitButton">
            </form>
            <div style="margin-top: 20px">
            <a style="margin-right: 25px;" href="index.html" class="sign-link">home</a>
            <a href="login.html" class="sign-link">I am already member</a>
        </div>
            <img src="img/signup-image.jpg" alt="signup-image" class="signup-image">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script type="module" src="./js/controllers/register.controller.js"></script>
</body>
</html>
