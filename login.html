<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/material-design-iconic-font.css">
    <link rel="stylesheet" href="./css/material-design-iconic-font.min.css">
</head>
<body>

    <div class="container">
        <div class="wrapper sign-in">
            <form id="loginForm" action="#" class="site-form">
                <h1 class="title">Sign in</h1>
                <span id="errorMessage" style="margin-bottom: 15px; height: 19px; color: red">Bu fake error xabar</span>
                <label>
                    <span class="zmdi zmdi-account"></span>
                    <input type="text" id="usernameInput" value="johndoe" name="username" placeholder="Your name">
                </label> 
                <label>
                    <span class="zmdi zmdi-lock"></span>
                    <input type="password" id="passwordInput" value="password123" name="password" placeholder="Password">
                    <button class="zmdi zmdi-eye" id="showButton" type="button"></button>
                </label>
                    <input type="submit" value="Log in" id="submitButton">
            </form>
            <div style="margin-top: 20px">
                <a style="margin-right: 25px;" href="index.html" class="sign-link">home</a>
                <a href="register.html" class="sign-link">Create an account</a>
            </div>
            <img src="img/signin-image.jpg" alt="signin-image" class="signin-image">
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js" integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script type="module" src="./js/controllers/login.controller.js"></script>

</body>
</html>
